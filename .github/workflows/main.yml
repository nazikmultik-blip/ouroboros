name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Download Gradle 2.14.1 (required by ForgeGradle 2.1)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip -d "$HOME"

      - name: Build
        env:
          GRADLE_OPTS: -Xmx2g
        run: |
          "$HOME/gradle-2.14.1/bin/gradle" --no-daemon setupCIWorkspace build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: OuroborosClient-jar
          path: build/libs/*.jar
        
